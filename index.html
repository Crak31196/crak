<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>🎬 Ansh's Name Reveal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<!-- ═══════════════════════════════
     SCREEN: INTRO
     ═══════════════════════════════ -->
<div id="screen-intro" class="screen active">
  <div class="intro-hero">
    <div class="film-strip">
      <div class="film-strip-hole"></div>
      <div class="film-strip-hole"></div>
      <div class="film-strip-hole"></div>
      <div class="film-strip-hole"></div>
      <div class="film-strip-hole"></div>
    </div>
    <div class="join-clapperboard">🎬</div>
    <h1 class="join-title">A Special Bollywood<br>Name Reveal</h1>
    <p class="join-subtitle">For our little superstar 👶🏻</p>
  </div>

  <div class="divider"></div>

  <div style="text-align:center;width:100%;max-width:420px">
    <p class="text-muted mb-16" style="font-size:.92rem;line-height:1.8">
      4 Bollywood movie riddles.<br>
      Arrange the letters to guess each movie.<br>
      The final answer will surprise you! 🌟
    </p>
    <button class="btn btn-primary btn-huge" onclick="Game.start()">
      PLAY 🎬
    </button>
  </div>
</div>

<!-- ═══════════════════════════════
     SCREEN: GAME
     ═══════════════════════════════ -->
<div id="screen-game" class="screen">

  <!-- Progress letters (revealed name so far) -->
  <div class="progress-bar">
    <div class="progress-letter"><span class="letter-char">?</span><div class="letter-glow"></div></div>
    <div class="progress-letter"><span class="letter-char">?</span><div class="letter-glow"></div></div>
    <div class="progress-letter"><span class="letter-char">?</span><div class="letter-glow"></div></div>
    <div class="progress-letter"><span class="letter-char">?</span><div class="letter-glow"></div></div>
  </div>

  <!-- Riddle header -->
  <div class="riddle-header">
    <span class="riddle-counter" id="riddle-number">RIDDLE 1 OF 4</span>
  </div>

  <!-- Riddle text -->
  <div class="riddle-card">
    <p class="riddle-label">🎬 BOLLYWOOD MYSTERY</p>
    <p class="riddle-text" id="riddle-text"></p>
  </div>

  <!-- ── PUZZLE (shown while solving) ── -->
  <div id="puzzle-section" class="puzzle-section">
    <p class="puzzle-hint">Arrange the letters to spell the movie name</p>

    <div id="puzzle-words" class="puzzle-words"></div>

    <div id="letter-tiles" class="letter-tiles"></div>

    <div class="puzzle-bottom-row">
      <button class="btn btn-secondary clear-btn" onclick="Game.clearAll()">↩ CLEAR</button>
      <button id="hint-btn" class="btn btn-secondary hint-btn" onclick="Game.playHint()" disabled>
        🎵 Hint <span id="hint-countdown" class="hint-countdown"></span>
      </button>
    </div>
  </div>

  <!-- ── SOLVED (shown after correct answer) ── -->
  <div id="solved-section" class="solved-section" style="display:none">
    <div class="solved-check">✅</div>
    <p class="solved-movie-name" id="solved-movie"></p>
    <p class="solved-dialogue" id="solved-dialogue"></p>

    <button class="btn btn-primary btn-huge" id="next-btn" onclick="Game.nextRiddle()">
      NEXT RIDDLE →
    </button>
  </div>

</div>

<!-- ═══════════════════════════════
     SCREEN: FINAL CINEMATIC
     ═══════════════════════════════ -->
<div id="screen-final" class="screen" style="justify-content:center">
  <div id="cinematic-scene" class="cinematic-scene"></div>
</div>

<!-- Scripts — no Firebase needed for single-player mode -->
<script src="js/audio.js"></script>
<script src="js/animations.js"></script>
<script src="js/game.js"></script>

</body>
</html>
